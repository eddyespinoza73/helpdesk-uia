{% extends "base.html" %}
{% block titulo %}Iniciar sesión — Help Desk UIA{% endblock %}
{% block page_class %}page--centrada{% endblock %}

{% block content %}
<div class="login-card">
  <div class="login-card__logo">HD</div>
  <h1>Help Desk UIA</h1>
  <p class="login-card__subtitulo">Ingresá con tu correo institucional para continuar.</p>

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="campo">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="nombre.apellido@empresa.cr" value="{{ correo|default('') }}" required autofocus>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn--primary btn--full">Iniciar sesión</button>
  </form>
</div>
{% endblock %}
